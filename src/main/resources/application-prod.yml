# =====================================================
# 生产环境配置（正式上线用）
# ⚠️ 敏感信息严禁明文写在此文件中，必须从环境变量或配置中心读取
# =====================================================
server:
  port: 8090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:gjjSystem}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai"
    # 用户名密码必须从环境变量读取，禁止写死！
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50   # 生产环境连接数调大
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000    # 空闲连接超时时间 10 分钟
      max-lifetime: 1800000   # 连接最大存活时间 30 分钟

# 生产环境只打 error 和 warn，减少日志量
logging:
  level:
    com.yibin.gjjsystem: warn
    org.springframework.web: warn
  # 生产环境可以加日志文件配置
  file:
    name: logs/gjj-system.log
  logback:
    rollingpolicy:
      max-file-size: 100MB   # 单个日志文件最大 100MB
      max-history: 30        # 保留 30 天
